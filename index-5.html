<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lewis Rentals — Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#e5e7eb;--brand:#111827;--accent:#2563eb;--good:#16a34a;--bad:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#111827,#334155)}.login-card{width:min(420px,100%);background:#fff;border-radius:22px;padding:30px;box-shadow:0 20px 60px #0004}.logo{font-size:28px;font-weight:800}.sub{color:var(--muted);margin:6px 0 24px}.field{margin:14px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;background:#fff}.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer}.btn.blue{background:var(--accent)}.btn.light{background:#eef2f7;color:var(--ink)}.btn.danger{background:#fee2e2;color:#991b1b}.msg{margin-top:12px;color:var(--bad);font-size:13px}.app{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:10}.brand{font-weight:800}.top-right{display:flex;align-items:center;gap:10px}.layout{display:flex}.side{width:230px;background:#111827;color:#fff;min-height:calc(100vh - 64px);padding:18px 12px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer}.nav button.active,.nav button:hover{background:#263244;color:#fff}.main{flex:1;padding:22px;min-width:0}.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.page-head h1{margin:0;font-size:25px}.muted{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px}.metric{font-size:25px;font-weight:800;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:16px}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}.table th{background:#f8fafc;font-size:12px;color:#64748b;text-transform:uppercase}.pill{display:inline-block;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700}.pill.good{background:#dcfce7;color:#166534}.pill.bad{background:#fee2e2;color:#991b1b}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.empty{padding:28px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0006;display:grid;place-items:center;padding:20px;z-index:30}.modal-card{background:#fff;border-radius:18px;width:min(520px,100%);padding:22px;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0}.close{border:0;background:#eef2f7;border-radius:50%;width:34px;height:34px;cursor:pointer}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;z-index:50}.error{color:var(--bad)}
@media(max-width:850px){.side{width:72px}.side .label{display:none}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.main{padding:15px}}@media(max-width:520px){.top{padding:0 12px}.cards{grid-template-columns:1fr 1fr}.metric{font-size:20px}.two{grid-template-columns:1fr}.main{padding:12px}}
</style></head>
<body>
<div id="login" class="login"><div class="login-card"><div class="logo">🏠 Lewis Rentals</div><div class="sub">Admin property management • Kamulu, Nairobi</div><div id="configMsg" class="msg hidden"></div><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn blue" style="width:100%">Sign in</button><div id="loginMsg" class="msg"></div></form></div></div>
<div id="app" class="app hidden"><header class="top"><div class="brand">🏠 Lewis Rentals</div><div class="top-right"><span id="userEmail" class="muted"></span><button id="logout" class="btn light">Log out</button></div></header><div class="layout"><aside class="side"><nav class="nav"><button data-page="dashboard" class="active">📊 <span class="label">Dashboard</span></button><button data-page="rooms">🚪 <span class="label">Rooms</span></button><button data-page="tenants">👥 <span class="label">Tenants</span></button><button data-page="bills">🧾 <span class="label">Bills</span></button><button data-page="payments">💰 <span class="label">Payments</span></button><button data-page="water">💧 <span class="label">Water</span></button><button data-page="expenses">💸 <span class="label">Expenses</span></button><button data-page="arrears">⚠️ <span class="label">Arrears</span></button><button data-page="reports">📈 <span class="label">Reports</span></button></nav></aside><main id="main" class="main"></main></div></div>
<div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL='https://trnbtljkzehkrgkinzop.supabase.co';
const SUPABASE_KEY='sb_publishable_vuC8A3VpCwrK8KLmCQ3Qvw_dmfl_3jU';
let db=null;
function setLoginMsg(message, ok=false){const el=$('loginMsg'); if(el){el.textContent=message;el.style.color=ok?'#166534':'#dc2626';}}
try{
  if(!window.supabase || !window.supabase.createClient) throw new Error('Supabase library did not load. Check your internet connection and reopen the page.');
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
}catch(err){
  const m=$('configMsg'); if(m){m.textContent=err.message;m.classList.remove('hidden');}
}

let state={page:'dashboard',property:null,rooms:[],tenants:[],bills:[],payments:[],water:[],expenses:[]};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2500)}
async function checkSession(){
  showLogin();
  if(!db){setLoginMsg('The Supabase connection could not be started. Reopen this page with internet access.');return;}
  try{
    const {data:{session},error}=await db.auth.getSession();
    if(error) throw error;
    if(session){await enter(session)}
  }catch(err){setLoginMsg(err.message||'Unable to check your login session.');}
}
async function enter(session){
  try{
    const {data:profile,error}=await db.from('profiles').select('id,role').eq('id',session.user.id).maybeSingle();
    if(error) throw error;
    if(!profile || profile.role!=='admin') throw new Error('This account is not registered as a Lewis Rentals administrator.');
    $('login').classList.add('hidden');$('app').classList.remove('hidden');$('userEmail').textContent=session.user.email||'';await loadAll();render();
  }catch(err){await db.auth.signOut();showLogin();setLoginMsg(err.message||'Login succeeded, but admin access could not be verified.');}
}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}
$('loginForm').onsubmit=async e=>{
  e.preventDefault();
  if(!db){setLoginMsg('Supabase is not connected. Reopen the page with internet access.');return;}
  const email=$('email').value.trim(), password=$('password').value;
  if(!email||!password){setLoginMsg('Enter your email and password.');return;}
  const btn=e.target.querySelector('button');btn.disabled=true;btn.textContent='Signing in…';setLoginMsg('Signing in…',true);
  try{
    const {data,error}=await db.auth.signInWithPassword({email,password});
    if(error) throw error;
    if(!data.session) throw new Error('Login completed but no session was returned.');
    await enter(data.session);
  }catch(err){setLoginMsg(err.message||'Unable to sign in.');}
  finally{btn.disabled=false;btn.textContent='Sign in';}
};
$('logout').onclick=async()=>{await db.auth.signOut();showLogin()};
async function loadAll(){
 let r=await db.from('properties').select('*').eq('name','Lewis Rentals').order('created_at',{ascending:true}).limit(1).maybeSingle();state.property=r.data;
 let q=await db.from('rooms').select('*').order('room_number');state.rooms=q.data||[];
 q=await db.from('tenants').select('*').order('room_number');state.tenants=q.data||[];
 q=await db.from('monthly_bills').select('*').order('billing_month',{ascending:false}).limit(100);state.bills=q.data||[];
 q=await db.from('payments').select('*').order('payment_date',{ascending:false}).limit(100);state.payments=q.data||[];
 q=await db.from('water_readings').select('*').order('reading_month',{ascending:false}).limit(100);state.water=q.data||[];
 q=await db.from('expenses').select('*').order('expense_date',{ascending:false}).limit(100);state.expenses=q.data||[];
}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));({dashboard:renderDashboard,rooms:renderRooms,tenants:renderTenants,bills:renderBills,payments:renderPayments,water:renderWater,expenses:renderExpenses,arrears:renderArrears,reports:renderReports}[state.page]||renderDashboard)()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{state.page=b.dataset.page;render()});
function renderDashboard(){const occupied=state.tenants.filter(t=>t.status!=='moved_out').length;const expected=state.rooms.length*4500;const collected=state.payments.reduce((a,p)=>a+Number(p.amount||0),0);const expenses=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0);$('main').innerHTML=`<div class="page-head"><div><h1>Dashboard</h1><div class="muted">Lewis Rentals • Kamulu, Nairobi</div></div><button class="btn blue" onclick="state.page='tenants';render()">+ Add tenant</button></div><div class="cards"><div class="card"><div class="muted">Total rooms</div><div class="metric">${state.rooms.length}</div></div><div class="card"><div class="muted">Occupied</div><div class="metric">${occupied}</div></div><div class="card"><div class="muted">Expected rent</div><div class="metric">KSh ${expected.toLocaleString()}</div></div><div class="card"><div class="muted">Collected</div><div class="metric">KSh ${collected.toLocaleString()}</div></div></div><div class="grid"><div class="card"><h3>Property settings</h3><p>Rent: <b>KSh 4,500</b>/month</p><p>Water: <b>KSh 130</b>/unit</p><p>Waste: <b>KSh 80</b>/month</p><p>Outstanding recorded bills: <b>KSh ${Math.max(0,state.bills.reduce((a,b)=>a+Number(b.balance||0),0)).toLocaleString()}</b></p></div><div class="card"><h3>Cash summary</h3><p>Payments recorded: <b>KSh ${collected.toLocaleString()}</b></p><p>Expenses recorded: <b>KSh ${expenses.toLocaleString()}</b></p><p>Net recorded: <b>KSh ${(collected-expenses).toLocaleString()}</b></p></div></div>`}
function renderRooms(){$('main').innerHTML=`<div class="page-head"><div><h1>Rooms</h1><div class="muted">20-room overview</div></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Room</th><th>Status</th><th>Tenant</th><th>Rent</th><th>Actions</th></tr></thead><tbody>${state.rooms.map(r=>{const t=state.tenants.find(x=>Number(x.room_number)===Number(r.room_number)&&x.status!=='moved_out');return `<tr><td><b>${r.room_number}</b></td><td><span class="pill ${t?'bad':'good'}">${t?'Occupied':'Vacant'}</span></td><td>${esc(t?.full_name||'—')}</td><td>KSh 4,500</td><td>${t?`<button class="btn light" onclick="openTenant(${t.id?JSON.stringify(t.id):'null'})">View</button>`:`<button class="btn blue" onclick="openTenant(null,${r.room_number})">Assign</button>`}</td></tr>`}).join('')}</tbody></table></div>`}
function renderTenants(){$('main').innerHTML=`<div class="page-head"><div><h1>Tenants</h1><div class="muted">Add and manage occupants</div></div><button class="btn blue" onclick="openTenant()">+ Add tenant</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Room</th><th>Rent</th><th>Deposit</th><th>Status</th></tr></thead><tbody>${state.tenants.map(t=>`<tr onclick='openTenant(${JSON.stringify(t.id)})' style="cursor:pointer"><td><b>${esc(t.full_name)}</b></td><td>${esc(t.phone||'—')}</td><td>${esc(t.room_number||'—')}</td><td>KSh ${Number(t.monthly_rent||4500).toLocaleString()}</td><td>KSh ${Number(t.deposit||4500).toLocaleString()}</td><td><span class="pill ${t.status==='active'?'good':'bad'}">${esc(t.status||'active')}</span></td></tr>`).join('')||`<tr><td colspan="6" class="empty">No tenants yet. Add the first tenant.</td></tr>`}</tbody></table></div>`}
function openTenant(id=null,room=null){let t=id?state.tenants.find(x=>String(x.id)===String(id)):null;const vacant=state.rooms.filter(r=>!state.tenants.some(x=>Number(x.room_number)===Number(r.room_number)&&x.status!=='moved_out'));$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>${t?'Tenant details':'Add tenant'}</h2><button class="close" onclick="closeModal()">×</button></div><form id="tenantForm"><div class="field"><label>Full name</label><input name="full_name" required value="${esc(t?.full_name||'')}"></div><div class="two"><div class="field"><label>Phone</label><input name="phone" value="${esc(t?.phone||'')}"></div><div class="field"><label>Room</label><select name="room_number" required>${state.rooms.map(r=>{const taken=state.tenants.some(x=>Number(x.room_number)===Number(r.room_number)&&x.status!=='moved_out'&&(!t||x.id!==t.id));return `<option value="${r.room_number}" ${Number(t?.room_number||room)===r.room_number?'selected':''} ${taken?'disabled':''}>Room ${r.room_number}${taken?' — occupied':''}</option>`}).join('')}</select></div></div><div class="two"><div class="field"><label>Move-in date</label><input type="date" name="move_in_date" value="${esc(t?.move_in_date||'')}"></div><div class="field"><label>Status</label><select name="status"><option value="active" ${t?.status!=='moved_out'?'selected':''}>Active</option><option value="moved_out" ${t?.status==='moved_out'?'selected':''}>Moved out</option></select></div></div><div class="two"><div class="field"><label>Monthly rent</label><input type="number" name="monthly_rent" value="${t?.monthly_rent||4500}"></div><div class="field"><label>Deposit</label><input type="number" name="deposit" value="${t?.deposit||4500}"></div></div><button class="btn blue">${t?'Save changes':'Add tenant'}</button>${t?` <button type="button" class="btn danger" onclick="moveOut('${t.id}')">Move out</button>`:''}</form></div>`;$('modal').classList.remove('hidden');$('tenantForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const obj=Object.fromEntries(f.entries());obj.room_number=Number(obj.room_number);obj.monthly_rent=Number(obj.monthly_rent);obj.deposit=Number(obj.deposit);if(t){const {error}=await db.from('tenants').update(obj).eq('id',t.id);if(error)return toast(error.message)}else{const {error}=await db.from('tenants').insert(obj);if(error)return toast(error.message)}closeModal();await loadAll();render();toast(t?'Tenant updated':'Tenant added')};}
async function moveOut(id){const {error}=await db.from('tenants').update({status:'moved_out'}).eq('id',id);if(error)toast(error.message);else{closeModal();await loadAll();render();toast('Tenant marked as moved out')}}
function closeModal(){$('modal').classList.add('hidden');$('modal').innerHTML=''}
function renderBills(){$('main').innerHTML=`<div class="page-head"><div><h1>Monthly Bills</h1><div class="muted">Rent + water + waste</div></div><button class="btn blue" onclick="openBill()">+ Create bill</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th>Room</th><th>Rent</th><th>Water</th><th>Waste</th><th>Total</th><th>Paid</th><th>Balance</th></tr></thead><tbody>${state.bills.map(b=>`<tr><td>${esc(b.billing_month)}</td><td>${b.room_number}</td><td>KSh ${Number(b.rent).toLocaleString()}</td><td>KSh ${Number(b.water_charge).toLocaleString()}</td><td>KSh ${Number(b.waste_charge).toLocaleString()}</td><td><b>KSh ${Number(b.total_bill).toLocaleString()}</b></td><td>KSh ${Number(b.amount_paid).toLocaleString()}</td><td>KSh ${Number(b.balance).toLocaleString()}</td></tr>`).join('')||`<tr><td colspan="8" class="empty">No bills yet.</td></tr>`}</tbody></table></div>`}
function openBill(){const active=state.tenants.filter(t=>t.status!=='moved_out');$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>Create monthly bill</h2><button class="close" onclick="closeModal()">×</button></div><form id="billForm"><div class="two"><div class="field"><label>Room</label><select name="room_number">${active.map(t=>`<option value="${t.room_number}">Room ${t.room_number} — ${esc(t.full_name)}</option>`).join('')}</select></div><div class="field"><label>Billing month</label><input type="date" name="billing_month" value="${new Date().toISOString().slice(0,7)}-01" required></div></div><div class="field"><label>Water units</label><input type="number" name="water_units" min="0" value="0"></div><button class="btn blue">Create bill</button></form></div>`;$('modal').classList.remove('hidden');$('billForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const room=Number(f.get('room_number')),units=Number(f.get('water_units')),rent=4500,water=units*130,waste=80,total=rent+water+waste;const obj={room_number:room,billing_month:f.get('billing_month'),rent,water_units:units,water_charge:water,waste_charge:waste,total_bill:total,amount_paid:0,balance:total};const {error}=await db.from('monthly_bills').insert(obj);if(error)toast(error.message);else{closeModal();await loadAll();render();toast('Bill created')}}}
function renderPayments(){$('main').innerHTML=`<div class="page-head"><div><h1>Payments</h1><div class="muted">Record rent and other payments</div></div><button class="btn blue" onclick="openPayment()">+ Record payment</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Room</th><th>Month</th><th>Amount</th><th>Method</th><th>Reference</th></tr></thead><tbody>${state.payments.map(p=>`<tr><td>${esc(p.payment_date)}</td><td>${p.room_number}</td><td>${esc(p.billing_month)}</td><td><b>KSh ${Number(p.amount).toLocaleString()}</b></td><td>${esc(p.payment_method||'')}</td><td>${esc(p.payment_reference||'—')}</td></tr>`).join('')||`<tr><td colspan="6" class="empty">No payments recorded.</td></tr>`}</tbody></table></div>`}
function openPayment(){const active=state.tenants.filter(t=>t.status!=='moved_out');$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>Record payment</h2><button class="close" onclick="closeModal()">×</button></div><form id="payForm"><div class="two"><div class="field"><label>Room</label><select name="room_number">${active.map(t=>`<option value="${t.room_number}">Room ${t.room_number} — ${esc(t.full_name)}</option>`).join('')}</select></div><div class="field"><label>Payment date</label><input type="date" name="payment_date" value="${new Date().toISOString().slice(0,10)}" required></div></div><div class="two"><div class="field"><label>Billing month</label><input type="date" name="billing_month" value="${new Date().toISOString().slice(0,7)}-01" required></div><div class="field"><label>Amount</label><input type="number" name="amount" min="1" required></div></div><div class="two"><div class="field"><label>Method</label><select name="payment_method"><option>M-Pesa</option><option>Cash</option><option>Bank</option><option>Other</option></select></div><div class="field"><label>Reference</label><input name="payment_reference" placeholder="e.g. M-Pesa code"></div></div><button class="btn blue">Save payment</button></form></div>`;$('modal').classList.remove('hidden');$('payForm').onsubmit=async e=>{e.preventDefault();const obj=Object.fromEntries(new FormData(e.target).entries());obj.room_number=Number(obj.room_number);obj.amount=Number(obj.amount);const {data,error}=await db.from('payments').insert(obj).select().single();if(error)return toast(error.message);const bill=state.bills.find(b=>Number(b.room_number)===obj.room_number&&String(b.billing_month)===obj.billing_month);if(bill){const allocated=Math.min(Number(obj.amount),Number(bill.balance));await db.from('payment_allocations').insert({payment_id:data.id,bill_id:bill.id,amount_allocated:allocated});await db.from('monthly_bills').update({amount_paid:Number(bill.amount_paid)+allocated,balance:Math.max(0,Number(bill.balance)-allocated)}).eq('id',bill.id)}closeModal();await loadAll();render();toast('Payment recorded')}}}
function renderWater(){$('main').innerHTML=`<div class="page-head"><div><h1>Water Readings</h1><div class="muted">KSh 130 per unit</div></div><button class="btn blue" onclick="openWater()">+ Add reading</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th>Room</th><th>Units</th><th>Charge</th></tr></thead><tbody>${state.water.map(w=>`<tr><td>${esc(w.reading_month)}</td><td>${w.room_number}</td><td>${w.units}</td><td>KSh ${(Number(w.units)*130).toLocaleString()}</td></tr>`).join('')||`<tr><td colspan="4" class="empty">No water readings yet.</td></tr>`}</tbody></table></div>`}
function openWater(){$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>Add water reading</h2><button class="close" onclick="closeModal()">×</button></div><form id="waterForm"><div class="two"><div class="field"><label>Room</label><select name="room_number">${state.rooms.map(r=>`<option>${r.room_number}</option>`).join('')}</select></div><div class="field"><label>Month</label><input type="date" name="reading_month" value="${new Date().toISOString().slice(0,7)}-01" required></div></div><div class="field"><label>Units</label><input type="number" name="units" min="0" step="0.01" required></div><button class="btn blue">Save reading</button></form></div>`;$('modal').classList.remove('hidden');$('waterForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries());o.room_number=Number(o.room_number);o.units=Number(o.units);const {error}=await db.from('water_readings').insert(o);if(error)toast(error.message);else{closeModal();await loadAll();render();toast('Water reading saved')}}}
function renderArrears(){
 const rows=state.bills.filter(b=>Number(b.balance||0)>0).map(b=>{const t=state.tenants.find(x=>Number(x.room_number)===Number(b.room_number)&&x.status!=='moved_out');return {b,t}});
 const total=rows.reduce((a,x)=>a+Number(x.b.balance||0),0);
 $('main').innerHTML=`<div class="page-head"><div><h1>Arrears</h1><div class="muted">Outstanding balances by room and billing month</div></div><button class="btn light" onclick="window.print()">🖨 Print</button></div><div class="cards"><div class="card"><div class="muted">Accounts in arrears</div><div class="metric">${rows.length}</div></div><div class="card"><div class="muted">Total outstanding</div><div class="metric">KSh ${total.toLocaleString()}</div></div><div class="card"><div class="muted">Active tenants</div><div class="metric">${state.tenants.filter(t=>t.status!=='moved_out').length}</div></div><div class="card"><div class="muted">Vacant rooms</div><div class="metric">${state.rooms.filter(r=>!state.tenants.some(t=>Number(t.room_number)===Number(r.room_number)&&t.status!=='moved_out')).length}</div></div></div><div class="table-wrap" style="margin-top:16px"><table class="table"><thead><tr><th>Room</th><th>Tenant</th><th>Month</th><th>Total bill</th><th>Paid</th><th>Balance</th><th>Action</th></tr></thead><tbody>${rows.map(({b,t})=>`<tr><td>${b.room_number}</td><td>${esc(t?.full_name||'—')}</td><td>${esc(b.billing_month)}</td><td>KSh ${Number(b.total_bill||0).toLocaleString()}</td><td>KSh ${Number(b.amount_paid||0).toLocaleString()}</td><td><span class="pill bad">KSh ${Number(b.balance||0).toLocaleString()}</span></td><td>${t?`<button class="btn light" onclick="openStatement(${JSON.stringify(t.id)})">Statement</button>`:''}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">No outstanding balances recorded.</td></tr>`}</tbody></table></div>`
}
function renderReports(){
 const collected=state.payments.reduce((a,p)=>a+Number(p.amount||0),0), expenses=state.expenses.reduce((a,e)=>a+Number(e.amount||0),0), billed=state.bills.reduce((a,b)=>a+Number(b.total_bill||0),0), outstanding=state.bills.reduce((a,b)=>a+Number(b.balance||0),0);
 const months=[...new Set([...state.bills.map(b=>String(b.billing_month).slice(0,7)),...state.payments.map(p=>String(p.billing_month).slice(0,7))])].sort().reverse();
 $('main').innerHTML=`<div class="page-head"><div><h1>Reports</h1><div class="muted">Financial summary and tenant statements</div></div><button class="btn light" onclick="window.print()">🖨 Print / Save PDF</button></div><div class="cards"><div class="card"><div class="muted">Total billed</div><div class="metric">KSh ${billed.toLocaleString()}</div></div><div class="card"><div class="muted">Payments</div><div class="metric">KSh ${collected.toLocaleString()}</div></div><div class="card"><div class="muted">Expenses</div><div class="metric">KSh ${expenses.toLocaleString()}</div></div><div class="card"><div class="muted">Outstanding</div><div class="metric">KSh ${outstanding.toLocaleString()}</div></div></div><div class="grid"><div class="card"><h3>Monthly summary</h3><div class="table-wrap"><table class="table" style="min-width:520px"><thead><tr><th>Month</th><th>Billed</th><th>Paid</th><th>Outstanding</th></tr></thead><tbody>${months.map(m=>{const bs=state.bills.filter(b=>String(b.billing_month).slice(0,7)===m), ps=state.payments.filter(x=>String(x.billing_month).slice(0,7)===m);const bb=bs.reduce((a,b)=>a+Number(b.total_bill||0),0), pp=ps.reduce((a,b)=>a+Number(b.amount||0),0);return `<tr><td>${m}</td><td>KSh ${bb.toLocaleString()}</td><td>KSh ${pp.toLocaleString()}</td><td>KSh ${Math.max(0,bb-pp).toLocaleString()}</td></tr>`}).join('')||`<tr><td colspan="4" class="empty">No monthly data yet.</td></tr>`}</tbody></table></div></div><div class="card"><h3>Expense summary</h3><div class="table-wrap"><table class="table" style="min-width:420px"><thead><tr><th>Category</th><th>Amount</th></tr></thead><tbody>${Object.entries(state.expenses.reduce((a,e)=>{const k=e.category||'Other';a[k]=(a[k]||0)+Number(e.amount||0);return a},{})).map(([k,v])=>`<tr><td>${esc(k)}</td><td>KSh ${v.toLocaleString()}</td></tr>`).join('')||`<tr><td colspan="2" class="empty">No expenses yet.</td></tr>`}</tbody></table></div></div></div><div class="card" style="margin-top:16px"><h3>Tenant statements</h3><div class="toolbar"><select id="statementTenant"><option value="">Select tenant</option>${state.tenants.map(t=>`<option value="${esc(t.id)}">${esc(t.full_name)} — Room ${esc(t.room_number)}</option>`).join('')}</select><button class="btn blue" onclick="const id=$('statementTenant').value;if(id)openStatement(id)">View statement</button></div></div>`
}
function openStatement(id){const t=state.tenants.find(x=>String(x.id)===String(id));if(!t)return;const bills=state.bills.filter(b=>Number(b.room_number)===Number(t.room_number));const pays=state.payments.filter(p=>Number(p.room_number)===Number(t.room_number));const totalB=bills.reduce((a,b)=>a+Number(b.total_bill||0),0), totalP=pays.reduce((a,b)=>a+Number(b.amount||0),0), bal=Math.max(0,totalB-totalP);$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>Tenant Statement</h2><button class="close" onclick="closeModal()">×</button></div><div id="statementPrint"><h3>${esc(t.full_name)}</h3><p>Room ${esc(t.room_number)} • ${esc(t.phone||'No phone')}</p><p>Monthly rent: <b>KSh ${Number(t.monthly_rent||4500).toLocaleString()}</b> • Deposit: <b>KSh ${Number(t.deposit||4500).toLocaleString()}</b></p><div class="table-wrap"><table class="table" style="min-width:480px"><thead><tr><th>Date</th><th>Type</th><th>Reference/Month</th><th>Amount</th></tr></thead><tbody>${bills.map(b=>`<tr><td>${esc(b.billing_month)}</td><td>Bill</td><td>Monthly bill</td><td>KSh ${Number(b.total_bill||0).toLocaleString()}</td></tr>`).join('')}${pays.map(x=>`<tr><td>${esc(x.payment_date)}</td><td>Payment</td><td>${esc(x.payment_reference||x.billing_month)}</td><td>KSh -${Number(x.amount||0).toLocaleString()}</td></tr>`).join('')||''}</tbody></table></div><p><b>Total billed:</b> KSh ${totalB.toLocaleString()} &nbsp; <b>Total paid:</b> KSh ${totalP.toLocaleString()} &nbsp; <b>Balance:</b> KSh ${bal.toLocaleString()}</p></div><button class="btn blue" onclick="window.print()">🖨 Print / Save PDF</button></div>`;$('modal').classList.remove('hidden')}
function renderExpenses(){$('main').innerHTML=`<div class="page-head"><div><h1>Expenses</h1><div class="muted">Repairs, maintenance and other costs</div></div><button class="btn blue" onclick="openExpense()">+ Add expense</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Room</th><th>Amount</th></tr></thead><tbody>${state.expenses.map(x=>`<tr><td>${esc(x.expense_date)}</td><td>${esc(x.description)}</td><td>${esc(x.category||'')}</td><td>${x.room_number||'—'}</td><td><b>KSh ${Number(x.amount).toLocaleString()}</b></td></tr>`).join('')||`<tr><td colspan="5" class="empty">No expenses recorded.</td></tr>`}</tbody></table></div>`}
function openExpense(){$('modal').innerHTML=`<div class="modal-card"><div class="modal-head"><h2>Add expense</h2><button class="close" onclick="closeModal()">×</button></div><form id="expForm"><div class="field"><label>Description</label><input name="description" required placeholder="e.g. Plumbing repair"></div><div class="two"><div class="field"><label>Category</label><input name="category" placeholder="Maintenance"></div><div class="field"><label>Amount</label><input type="number" name="amount" min="0" required></div></div><div class="two"><div class="field"><label>Date</label><input type="date" name="expense_date" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Room (optional)</label><input type="number" name="room_number" min="1" max="20"></div></div><button class="btn blue">Save expense</button></form></div>`;$('modal').classList.remove('hidden');$('expForm').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries());o.amount=Number(o.amount);if(!o.room_number)delete o.room_number;else o.room_number=Number(o.room_number);const {error}=await db.from('expenses').insert(o);if(error)toast(error.message);else{closeModal();await loadAll();render();toast('Expense saved')}}}
checkSession();
</script></body></html>
